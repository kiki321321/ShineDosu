<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>京ことば 変換所</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="kyoto-app">
      <div class="wrap">
        <header>
          <h1>京ことば 変換所</h1>
          <p class="lead">話し言葉を入力すると、京都弁に変換されるどす。</p>
        </header>

        <div class="grid">
          <section class="panel">
            <div class="tag">入力</div>
            <textarea id="inputText" placeholder="例: 今日は何してるの？一緒に行こう。"></textarea>
            <div class="actions">
              <button id="convertBtn">変換する</button>
              <button class="secondary" id="clearBtn">消去</button>
            </div>
          </section>

          <section class="panel">
            <div class="tag">京都弁</div>
            <textarea id="outputText" readonly placeholder="ここに変換結果が表示されます"></textarea>
            <div class="actions">
              <button class="secondary" id="copyBtn">コピー</button>
              <button class="secondary" id="shareBtn">シェア</button>
              <button class="secondary x-btn" id="xBtn">
                <span class="icon">𝕏</span>
                Xに送信
              </button>
              <button class="secondary line-btn" id="lineBtn">
                <span class="icon">LINE</span>
                LINEに送信
              </button>
            </div>
            <div class="note" id="statusText">準備完了</div>
          </section>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
